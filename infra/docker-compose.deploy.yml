# Deploy compose for hitl-test.
# Runs on staging/prod servers with pre-built ghcr.io images.
# Copy to /app/hitl-test/docker-compose.yml on deploy server.
#
# Required .env:
#   IMAGE_TAG=staging  (or version tag for prod)
#   POSTGRES_PASSWORD=<random>
#   SECRET_KEY=<random>
#   DOMAIN=hitl-test.example.com

services:
  frontend:
    image: ghcr.io/OWNER/hitl-test-frontend:${IMAGE_TAG:-staging}
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 512M }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s

  backend:
    image: ghcr.io/OWNER/hitl-test-backend:${IMAGE_TAG:-staging}
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://app:${POSTGRES_PASSWORD}@db:5432/hitl-test
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS=https://${DOMAIN}
    depends_on:
      db: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 1G }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=hitl-test
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [frontend, backend]

volumes:
  pg_data:
  caddy_data:
